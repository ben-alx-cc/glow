<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chrome Animation</title>
    
    <!-- iOS Home Screen Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chrome">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231a1a1a' width='180' height='180'/><circle fill='%23c0c0c0' cx='90' cy='90' r='60'/></svg>">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000000;
            font-family: 'Arial', sans-serif;
            /* iOS Safe Area Support (für Notch/Dynamic Island) */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
            height: 100dvh; /* Dynamic Viewport Height für iOS */
            touch-action: none; /* Verhindert Zoom/Scroll beim Touch */
        }
        
    </style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // Scene Setup - Pure Black
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.Fog(0x000000, 10, 50);

        // Camera
        const camera = new THREE.PerspectiveCamera(
            50,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );
        camera.position.set(0, 0, 6);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            alpha: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1;
        controls.minDistance = 3;
        controls.maxDistance = 15;

        // Environment Map (Simple Cube Texture)
        const createEnvironment = () => {
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();

            // Create simple gradient environment
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Create gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, 512);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.5, '#888888');
            gradient.addColorStop(1, '#444444');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            
            const envTexture = pmremGenerator.fromEquirectangular(texture).texture;
            scene.environment = envTexture;
            
            texture.dispose();
            pmremGenerator.dispose();
            
            console.log('✅ Environment map loaded');
        };

        createEnvironment();

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight1.position.set(5, 5, 5);
        scene.add(directionalLight1);

        const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight2.position.set(-5, -5, -5);
        scene.add(directionalLight2);

        // Chrome Material (Silber)
        const chromeMaterial = new THREE.MeshStandardMaterial({
            color: 0xc0c0c0,
            metalness: 1.0,
            roughness: 0.05,
            envMapIntensity: 1.5
        });

        // Main Object - Torus Knot (looks amazing with chrome!)
        const torusGeometry = new THREE.TorusKnotGeometry(1.2, 0.4, 120, 32);
        const torusKnot = new THREE.Mesh(torusGeometry, chromeMaterial);
        scene.add(torusKnot);

        // Additional Chrome Spheres floating around
        const spheres = [];
        for (let i = 0; i < 5; i++) {
            const sphereGeometry = new THREE.SphereGeometry(0.3, 32, 32);
            const sphere = new THREE.Mesh(sphereGeometry, chromeMaterial.clone());
            
            const angle = (i / 5) * Math.PI * 2;
            const radius = 3;
            sphere.position.x = Math.cos(angle) * radius;
            sphere.position.y = Math.sin(angle * 2) * 0.5;
            sphere.position.z = Math.sin(angle) * radius;
            
            spheres.push(sphere);
            scene.add(sphere);
        }

        // Background Particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 200;
        const positions = new Float32Array(particlesCount * 3);
        
        for (let i = 0; i < particlesCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 30;
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.075,
            transparent: true,
            opacity: 0.6
        });
        
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // Animation
        let time = 0;
        let rotationSpeed = 1.0; // Normale Geschwindigkeit
        let speedBoostTimeout = null;
        
        // Click und Touch Handler für Speed Boost
        function handleInteraction(event) {
            event.preventDefault();
            
            // Speed erhöhen
            rotationSpeed = 3.0;
            
            // Reset nach 2 Sekunden
            if (speedBoostTimeout) clearTimeout(speedBoostTimeout);
            speedBoostTimeout = setTimeout(() => {
                rotationSpeed = 1.0;
            }, 2000);
        }
        
        // Click Event
        renderer.domElement.addEventListener('click', handleInteraction);
        
        // Touch Events (Mobile)
        renderer.domElement.addEventListener('touchstart', handleInteraction);
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01 * rotationSpeed;
            
            // Rotate main object
            torusKnot.rotation.x = time * 0.3;
            torusKnot.rotation.y = time * 0.5;
            
            // Animate spheres (auch mit Speed-Boost)
            spheres.forEach((sphere, i) => {
                const angle = time + (i / 5) * Math.PI * 2;
                const radius = 3;
                sphere.position.x = Math.cos(angle) * radius;
                sphere.position.y = Math.sin(angle * 2) * 1;
                sphere.position.z = Math.sin(angle) * radius;
                sphere.rotation.x = time;
                sphere.rotation.y = time * 0.7;
            });
            
            // Rotate particles slowly
            particles.rotation.y = time * 0.05;
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        animate();
        
        console.log('✨ Chrome Animation Ready!');
        console.log('💡 Metalness: 1.0, Roughness: 0.05');
        console.log('🎨 Environment Map Active');
    </script>
</body>
</html>
